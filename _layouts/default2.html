<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ page.title }} | Binshuai Wang</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Binshuai Wang">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <!-- Enable LaTeX math rendering -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      svg: {
        fontCache: 'global'
      }
    };
  </script>
  <script
    defer
    src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-svg.js">
  </script>
</head>

<body>
  <div class="page">
    <aside class="sidebar">
      <h2> </h2>
      <nav>
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/publications/' | relative_url }}">Publications</a>
        <a href="{{ '/blog/' | relative_url }}">Blog</a>
        <a href="{{ '/cv/' | relative_url }}">CV</a>
        <a href="{{ '/#contact' | relative_url }}">Contact</a>
      </nav>
    </aside>

    <main class="content">
      {{ content }}
    </main>
  </div>

  <footer class="footer">
    <p>&copy; 2026 Binshuai Wang. All rights reserved. Inspired by al-folio.</p>
  </footer>
</body>
</html>
