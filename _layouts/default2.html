<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ page.title }} | Binshuai Wang</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Binshuai Wang">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <!-- Apply saved sidebar state before render to avoid a flash of the wrong layout -->
  <script>
    try {
      if (localStorage.getItem('sidebarCollapsed') === 'true') {
        document.documentElement.classList.add('sidebar-collapsed');
      }
    } catch (e) {}
  </script>

  <!-- Enable LaTeX math rendering -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      svg: {
        fontCache: 'global'
      }
    };
  </script>
  <script
    defer
    src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-svg.js">
  </script>
</head>

<body>
  <div class="page">
    <aside class="sidebar">
      <div class="sidebar-head">
        <button type="button" id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle navigation" aria-expanded="true">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="4" width="18" height="16" rx="3" stroke="currentColor" stroke-width="1.6"></rect>
            <line x1="15" y1="4" x2="15" y2="20" stroke="currentColor" stroke-width="1.6"></line>
            <polygon class="toggle-arrow" points="7.5,9 7.5,15 10,12" fill="currentColor"></polygon>
          </svg>
        </button>
      </div>
      <nav>
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/publications/' | relative_url }}">Publications</a>
        <a href="{{ '/blog/' | relative_url }}">Blog</a>
        <a href="{{ '/cv/' | relative_url }}">CV</a>
        <a href="{{ '/#contact' | relative_url }}">Contact</a>
      </nav>
    </aside>

    <main class="content">
      {{ content }}
    </main>

  </div>


  <footer class="footer">
    <p>&copy; 2026 Binshuai Wang. All rights reserved. Inspired by al-folio. Assisted by GPT and Claude.</p>
  </footer>

  <script>
    (function () {
      var toggle = document.getElementById('sidebar-toggle');
      if (!toggle) return;
      var root = document.documentElement;

      function isCollapsed() {
        return root.classList.contains('sidebar-collapsed');
      }

      toggle.setAttribute('aria-expanded', String(!isCollapsed()));

      toggle.addEventListener('click', function () {
        var collapsed = !isCollapsed();
        root.classList.toggle('sidebar-collapsed', collapsed);
        toggle.setAttribute('aria-expanded', String(!collapsed));
        try {
          localStorage.setItem('sidebarCollapsed', collapsed);
        } catch (e) {}
      });
    })();
  </script>
</body>
</html>
